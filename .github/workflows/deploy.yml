# GitHub → Cloudflare 배포 (방법 B: GitHub Actions)
# 방법 A(Cloudflare Workers Builds 의 Git 연동)를 쓰면 이 워크플로는 필요 없다. docs/DEPLOY.md 참고.
#
# 필요한 저장소 Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit, D1:Edit 권한이 있는 API 토큰
#   CLOUDFLARE_ACCOUNT_ID — 3c166b189a0b269ef920ffe9301ae05d
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build
      - name: Apply D1 migrations
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply moonlight-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
