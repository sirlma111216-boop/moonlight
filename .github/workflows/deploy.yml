# GitHub → Cloudflare 배포 (방법 B: GitHub Actions)
# 방법 A(Cloudflare Workers Builds 의 Git 연동)를 쓰면 배포 단계는 필요 없다. docs/DEPLOY.md 참고.
#
# 필요한 저장소 Secrets (없으면 테스트·빌드까지만 실행):
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit, D1:Edit 권한이 있는 API 토큰
#   CLOUDFLARE_ACCOUNT_ID — 3c166b189a0b269ef920ffe9301ae05d
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    env:
      # 단계의 if 에서는 secrets 를 직접 쓸 수 없어서 작업 환경변수로 존재 여부만 넘긴다
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build
      - name: Apply D1 migrations
        if: env.HAS_CF_TOKEN == 'true' && github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply moonlight-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: env.HAS_CF_TOKEN == 'true' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy skipped
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뛰었습니다. 테스트·빌드는 통과했습니다."
